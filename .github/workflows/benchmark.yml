name: Performance benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture performance or verify a tag-bound operational candidate
        type: choice
        required: true
        default: capture
        options: [capture, operational-candidate]
      native_run_id:
        description: Successful current-tag native push run; required for operational-candidate
        type: string
        required: false
      benchmark_baseline:
        description: Committed package-relative baseline; required for operational-candidate
        type: string
        required: false
      scale:
        description: Design Craft benchmark scale; capture only, no certification
        type: choice
        required: true
        default: full
        options: [smoke, full]
permissions:
  contents: read
concurrency:
  group: design-benchmark-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/design-craft
jobs:
  capture:
    if: inputs.mode == 'capture'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Capture current-source benchmark
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          BENCHMARK_SCALE: ${{ inputs.scale }}
        run: >-
          python3 -m tools.design_craft benchmark
          --scale "$BENCHMARK_SCALE"
          --output "$RUNNER_TEMP/benchmark-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-${{ inputs.scale }}-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark-result.json
          if-no-files-found: error
          retention-days: 90

  operational-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'operational-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate candidate inputs
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="design-craft/v$(cat VERSION)"
          test "${GITHUB_REF}" = "refs/tags/${expected_tag}"
          test "$(git cat-file -t "${expected_tag}")" = tag
          test "$(git rev-list -n 1 "${expected_tag}")" = "${GITHUB_SHA}"
          [[ "${NATIVE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 2
          [[ "${BENCHMARK_BASELINE}" == benchmarks/baselines/* ]] || exit 2
          [[ "${BENCHMARK_BASELINE}" != *..* ]] || exit 2
          test -f "${BENCHMARK_BASELINE}"
          git ls-files --error-unmatch -- "${BENCHMARK_BASELINE}" >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Observe exact native source run
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: >-
          python3 -m tools.design_craft release run-observation
          --kind native
          --run-id "${NATIVE_RUN_ID}"
          --output "${RUNNER_TEMP}/operational-candidate/native-run-observation.json"
      - name: Download native runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          evidence_root="${RUNNER_TEMP}/native-evidence"
          mkdir -p "${evidence_root}/ios" "${evidence_root}/android" "${evidence_root}/combined"
          gh run download "${NATIVE_RUN_ID}" --name "native-runtime-ios-${NATIVE_RUN_ID}" --dir "${evidence_root}/ios"
          gh run download "${NATIVE_RUN_ID}" --name "native-runtime-android-${NATIVE_RUN_ID}" --dir "${evidence_root}/android"
          cp -R "${evidence_root}/ios/." "${evidence_root}/combined/"
          cp -R "${evidence_root}/android/." "${evidence_root}/combined/"
          test -f "${evidence_root}/combined/ios-observed.json"
          test -f "${evidence_root}/combined/android-observed.json"
      - name: Run immutable full benchmark
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m tools.design_craft benchmark
          --scale full
          --output "${RUNNER_TEMP}/operational-candidate/benchmark-result-full.json"
      - name: Certify Operational 95 release candidate
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
          DESIGN_CRAFT_NATIVE_EVIDENCE_ROOT: ${{ runner.temp }}/native-evidence/combined
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          make release-readiness-operational
          BENCHMARK_BASELINE="${BENCHMARK_BASELINE}"
          BENCHMARK_RESULT="${RUNNER_TEMP}/operational-candidate/benchmark-result-full.json"
          OPERATIONAL_CANDIDATE_EVIDENCE="${RUNNER_TEMP}/operational-candidate/dist/evidence/operational-95-candidate.json"
      - name: Upload Operational 95 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operational-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operational-candidate/native-run-observation.json
            ${{ runner.temp }}/operational-candidate/benchmark-result-full.json
            ${{ runner.temp }}/operational-candidate/dist/evidence/operational-95-candidate.json
          if-no-files-found: error
          retention-days: 90
