name: Browser67 platform checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser67-platform-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/browser67
jobs:
  contracts:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/browser67/package-lock.json
      - run: npm ci
      - run: npm run verify:ci
  remote-cdp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/browser67/package-lock.json
      - run: npm ci
      - name: Resolve runner Chrome for isolated fixture
        shell: bash
        run: |
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - run: npm run check:remote-cdp
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/browser67/package-lock.json
      - run: npm ci
      - run: npm run coverage:contracts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser67-coverage-${{ github.sha }}
          path: packages/browser67/runtime/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
