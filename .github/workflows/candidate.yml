name: Offline candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-candidates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [review-craft, 3d-craft, creative-craft, whoami]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.package == 'whoami' && '24.18.0' || '24' }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked package dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - name: Install pinned Creative validation dependencies
        if: matrix.package == 'creative-craft'
        run: python3 -m pip install -r packages/creative-craft/requirements-dev.txt
      - name: Build through the package's existing candidate gate
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/candidate.py build --package "$PACKAGE" --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ matrix.package }}-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
  verify-download:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [review-craft, 3d-craft, creative-craft, whoami]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-${{ matrix.package }}-${{ github.sha }}
          path: ${{ runner.temp }}/downloaded
      - name: Verify downloaded identity, complete file set and SHA-256
        env:
          PACKAGE: ${{ matrix.package }}
        run: >-
          python3 scripts/candidate.py verify --package "$PACKAGE"
          --directory "$RUNNER_TEMP/downloaded" --expected-sha "$GITHUB_SHA"
