name: Workflow Craft platform checks
on:
  push:
    paths:
      - 'packages/workflow-craft/**'
      - '.github/workflows/workflow-craft-platform.yml'
  pull_request:
    paths:
      - 'packages/workflow-craft/**'
      - '.github/workflows/workflow-craft-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-craft-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Run package contracts including native process and cross-clone checks
        working-directory: packages/workflow-craft
        run: python scripts/check.py
