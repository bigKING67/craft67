name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [design-craft, creative-craft, review-craft, money-craft, whoami, browser67, commerce-growth-os, 3d-craft, reverse-craft, write-craft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked JavaScript dependencies when present
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - name: Run package checks
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/check.py --package "$PACKAGE"
