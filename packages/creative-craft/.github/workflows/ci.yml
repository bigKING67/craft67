name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gates:
    name: Full gates / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check skills/creative-craft/scripts scripts tests
      - run: python scripts/validate_schemas.py
      - run: python scripts/validate.py
      - run: python scripts/host_smoke.py
      - run: python -m compileall -q skills scripts tests

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'macOS'
        with:
          node-version: "24"
      - run: python scripts/validate.py
      - run: python scripts/host_smoke.py
      - name: Pi local package discovery
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          npx --yes @earendil-works/pi-coding-agent@0.80.6 install . --no-approve
          npx --yes @earendil-works/pi-coding-agent@0.80.6 list

  package-boundary:
    name: GitHub package boundary / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python3 scripts/check_package.py
      - name: Exact package runtime smoke
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/creative-craft-package"
          mkdir -p "$package_dir"
          package_name="$(npm pack --silent --pack-destination "$package_dir")"
          python3 scripts/package_smoke.py \
            --package "$package_dir/$package_name" \
            --json

  local-production:
    name: Local production / Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/local-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # fetch-font re-checks the pinned digest, so a cache hit is still verified.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integrations/local-production/fonts/*.ttf
          key: caption-font-${{ hashFiles('integrations/local-production/fonts/manifest.json') }}
      - run: npm run fetch-font
      - run: npm test

  local-production-smoke:
    name: Local production render smoke
    runs-on: ubuntu-latest
    needs: local-production
    defaults:
      run:
        working-directory: integrations/local-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r ../../requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # fetch-font re-checks the pinned digest, so a cache hit is still verified.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integrations/local-production/fonts/*.ttf
          key: caption-font-${{ hashFiles('integrations/local-production/fonts/manifest.json') }}
      - run: npm run fetch-font
      - run: CREATIVE_PYTHON="$(command -v python)" npm run smoke
        env:
          PRODUCER_HEADLESS_SHELL_PATH: /usr/bin/google-chrome

  image-production:
    name: Local image production / Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/image-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The 16 MB pinned font is digest-checked by fetch-font, so a cache hit is still verified.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: integrations/image-production/fonts/*.otf
          key: image-font-${{ hashFiles('integrations/image-production/fonts/manifest.json') }}
      - run: npm run fetch-font
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:candidates

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
