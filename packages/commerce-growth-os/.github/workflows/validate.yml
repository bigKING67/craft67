name: validate-skill-pack

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate repository and skill bundles
        run: bash scripts/validate.sh

      - name: Validate release contract
        run: python3 tooling/validation/check_release.py

      - name: Validate tag matches pack version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tooling/validation/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Install into an isolated registry
        run: bash scripts/install.sh --install-root "${RUNNER_TEMP}/skills"

      - name: Verify isolated installation parity
        run: python3 tooling/installation/verify_install.py --install-root "${RUNNER_TEMP}/skills"

      - name: Check patch whitespace
        run: git diff-tree --check --root -r HEAD
