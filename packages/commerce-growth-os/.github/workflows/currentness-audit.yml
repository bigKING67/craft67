name: audit-official-source-reachability

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Validate registry structure
        run: python3 tooling/evaluation/check_source_registry.py shared/currentness/currentness-official-sources.md

      - name: Audit public official entry-point reachability
        run: >-
          python3 tooling/evaluation/audit_source_registry.py
          shared/currentness/currentness-official-sources.md
          --output official-source-reachability.json
          --fail-on hard

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-source-reachability
          path: official-source-reachability.json
          if-no-files-found: warn
          retention-days: 14
