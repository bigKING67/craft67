# Companion infrastructure example; not part of the installed TWC runtime.
# Use an explicit --project-name and --env-file. Never run inside an AIOS stack.
services:
  server:
    image: docker.gitea.com/gitea:28.1.0-rootless@sha256:b1a90409ae9afcd5a5725404c3639da7245248848b99e35332968891290b953e
    restart: unless-stopped
    user: "1000:1000"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/db_password
      GITEA__database__SSL_MODE: disable
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY__FILE: /run/secrets/secret_key
      GITEA__security__INTERNAL_TOKEN__FILE: /run/secrets/internal_token
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:?Set the approved Gitea hostname}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__LFS_START_SERVER: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__service__DEFAULT_ORG_VISIBILITY: private
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DISABLE_HTTP_GIT: "false"
      GITEA__repository__DISABLE_MIGRATIONS: "true"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
      GITEA__actions__ENABLED: "false"
      GITEA__packages__ENABLED: "false"
      GITEA__mailer__ENABLED: "false"
      GITEA__log__MODE: console
      GITEA__log__LEVEL: Info
    secrets: [db_password, secret_key, internal_token]
    volumes:
      - data:/var/lib/gitea
      - config:/etc/gitea
    networks: [data, edge]
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:3000/api/healthz]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.team-gitea.rule: Host(`${GITEA_DOMAIN}`)
      traefik.http.routers.team-gitea.entrypoints: websecure
      traefik.http.routers.team-gitea.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-myresolver}
      traefik.http.services.team-gitea.loadbalancer.server.port: "3000"
      traefik.http.routers.team-gitea-http.rule: Host(`${GITEA_DOMAIN}`)
      traefik.http.routers.team-gitea-http.entrypoints: web
      traefik.http.routers.team-gitea-http.middlewares: team-gitea-https
      traefik.http.middlewares.team-gitea-https.redirectscheme.scheme: https
      traefik.http.middlewares.team-gitea-https.redirectscheme.permanent: "true"

  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    command: [postgres, -c, max_connections=50, -c, shared_buffers=128MB]
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, gitea, -d, gitea]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  data:
    internal: true
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  data:
  config:
  postgres:

secrets:
  db_password:
    file: ${GITEA_SECRET_DIR:?Set an absolute host-only secret directory}/db_password
  secret_key:
    file: ${GITEA_SECRET_DIR}/secret_key
  internal_token:
    file: ${GITEA_SECRET_DIR}/internal_token
