# Compose >= 2.24.4. Always use a NEW project name and NEW volumes.
# Disable proxy discovery and all network egress before starting restored data.
# Inspect with docker compose exec; this fixture has no host port or public URL.
services:
  server:
    labels: !override
      traefik.enable: "false"
    networks: !override [data]
    environment:
      GITEA__server__DOMAIN: restore.example.invalid
      GITEA__server__ROOT_URL: http://restore.example.invalid/
      GITEA__mailer__ENABLED: "false"
      GITEA__actions__ENABLED: "false"
    ports: !reset []
networks:
  edge: !reset null
