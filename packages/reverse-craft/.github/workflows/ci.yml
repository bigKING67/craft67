name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source and Skill contracts
        run: python scripts/validate.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run bilingual routing bank
        run: python scripts/run_route_bank.py
      - name: Run offline scenario bank
        run: python scripts/run_scenario_bank.py
