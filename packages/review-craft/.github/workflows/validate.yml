name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          download-from-astral-mirror: false
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -p test_*.py
      - name: Validate source and schemas
        run: uv run --locked python scripts/validate.py
      - name: Run Ruff
        run: uv run --locked ruff check .

  release-contract:
    name: Release contract and exact package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          download-from-astral-mirror: false
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Run complete release contract
        run: >-
          uv run --locked python scripts/release_gate.py
          --package-output artifacts/review-craft.tgz
          --package-receipt artifacts/package-receipt-ubuntu.json
      - name: Upload exact validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-validated-package
          path: |
            artifacts/review-craft.tgz
            artifacts/package-receipt-ubuntu.json
          if-no-files-found: error
          retention-days: 7

  installed-runtime-e2e:
    name: Exact package E2E / ${{ matrix.os }}
    needs: release-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Download exact validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-validated-package
          path: artifacts
      - name: Revalidate exact package on host
        run: >-
          python scripts/package_check.py
          --tarball artifacts/review-craft.tgz
          --receipt artifacts/package-receipt-${{ matrix.os }}.json
      - name: Upload host receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-receipt-${{ matrix.os }}
          path: artifacts/package-receipt-${{ matrix.os }}.json
          if-no-files-found: ignore
          retention-days: 7
