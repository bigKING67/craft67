name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/validate.py
      - run: python3 scripts/check_package.py

  report-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Report validation with disposable dependencies
        run: |
          python3 scripts/test_environment.py --runtime report --output-dir local/ci-report -- \
            sh -c '"$MONEY_CRAFT_REPORT_PYTHON" -m unittest tests.test_report_renderer -v && "$MONEY_CRAFT_REPORT_PYTHON" scripts/report_smoke.py'
